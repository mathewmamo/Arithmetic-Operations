<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arithmetic Operations</title>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 3rem auto; padding: 0 1rem; }
    input, select, button { font-size: 1rem; padding: 0.5rem; margin: 0.25rem 0; width: 100%; box-sizing: border-box; }
    #result { margin-top: 1rem; font-size: 1.25rem; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Arithmetic Operations</h1>
  <input id="first" type="number" placeholder="First number">
  <select id="op">
    <option value="add">+ Add</option>
    <option value="subtract">- Subtract</option>
    <option value="multiply">× Multiply</option>
    <option value="divide">÷ Divide</option>
  </select>
  <input id="second" type="number" placeholder="Second number">
  <button onclick="calculate()">Calculate</button>
  <div id="result"></div>

  <script>
    function calculate() {
      const a = parseFloat(document.getElementById("first").value);
      const b = parseFloat(document.getElementById("second").value);
      const op = document.getElementById("op").value;
      const out = document.getElementById("result");

      if (isNaN(a) || isNaN(b)) { out.textContent = "Please enter both numbers."; return; }

      let result;
      if (op === "add") result = a + b;
      else if (op === "subtract") result = a - b;
      else if (op === "multiply") result = a * b;
      else {
        if (b === 0) { out.textContent = "Cannot divide by zero."; return; }
        result = a / b;
      }
      out.textContent = "Result: " + result;
    }
  </script>
</body>
</html>
